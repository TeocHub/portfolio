<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Haikus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: var(--acento); /* Morado vibrante */
            --secondary-color: var(--acento); /* Lila suave */
            --accent-color: var(--h1); /* Verde azulado (teal) */
            --text-color: var(--h3);
            --light-bg: var(--fondo); /* Un gris muy claro y suave */
            --white: var(--superficie);
            --shadow: 0 4px 15px rgb(var(--tinta-rgb) / 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--texto);
            background-color: var(--fondo);
            color: var(--h3);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--acento-relleno), var(--acento-relleno));
            color: var(--tinta);
            padding: 2.5rem 0;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        h1 {
            font-family: var(--display);
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: var(--texto);
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.9;
        }

        main {
            flex: 1;
            padding: 3rem 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; /* Centra el botón */
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: var(--h1-relleno); /* Usa el color acentuado para el botón principal */
            color: var(--tinta);
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            margin: 2rem auto;
        }

        .btn:hover {
            background-color: var(--h1-relleno); /* Un tono más oscuro del teal al pasar el mouse */
            transform: translateY(-3px);
            box-shadow: var(--sombra-suave);
        }

        .haiku-container {
            display: none;
            text-align: center;
            padding: 3rem;
            background: linear-gradient(135deg, var(--superficie) 0%, var(--fondo) 100%);
            border-radius: var(--radio);
            margin-top: 2rem;
            box-shadow: var(--shadow);
            width: 100%;
            border: 1px solid var(--h3);
        }

        .haiku-title {
            font-family: var(--display);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--acento);
        }

        .haiku-lines {
            font-family: var(--display);
            font-size: 1.8rem;
            line-height: 2.2;
            color: var(--h3);
        }

        .haiku-line {
            margin: 0.5rem 0;
            padding: 0.5rem;
            transition: var(--transition);
        }

        .haiku-line:hover {
            transform: scale(1.05);
            color: var(--h1);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid rgb(var(--trazo-rgb) / 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--h1); /* El spinner ahora usa el color acentuado */
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background-color: var(--superficie);
            border-radius: var(--radio-sm);
            box-shadow: var(--sombra-suave);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid var(--acento); /* Verde para éxito */
        }

        .notification.error {
            border-left: 4px solid var(--acento); /* Rojo para error */
        }

        .notification.info {
            border-left: 4px solid var(--h1); /* Teal para info */
        }
    </style>

  <link rel="icon" href="../../../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../../assets/css/site.css">
  <link rel="stylesheet" href="../../../../assets/css/armonia.css">
  <script src="../../../../assets/js/site.js"></script>
  <!-- barajas aplicadas -->
</head>
<body>
    <header>
        <div class="container">
            <h1>Generador de Haikus</h1>
            <p class="subtitle">Pablo Neruda - 7mo 2025</p>
        </div>
    </header>

    <main>
        <div class="container">
            <button class="btn" id="generateButton">
                <i class="fas fa-magic"></i> Generar Haiku
            </button>

            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Generando haiku...</p>
            </div>

            <div class="haiku-container" id="haikuContainer">
                <h3 class="haiku-title" id="haikuTitle"></h3>
                <div class="haiku-lines">
                    <div class="haiku-line" id="line1"></div>
                    <div class="haiku-line" id="line2"></div>
                    <div class="haiku-line" id="line3"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 1rem 0; font-size: 0.9rem; color: var(--h3);">
            &ast; Esta página cuenta con las líneas creadas por los estudiantes del Pablo Neruda 7mo del 2025.
        </div>
    </footer>

    <div class="notification" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
